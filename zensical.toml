# InvestingLab documentation site (Zensical).
# Build: `just docs-build` · Live preview: `just docs`
[project]
site_name = "InvestingLab"
site_description = "Plataforma personal de análisis de mercados, carteras y simulación."
site_author = "Javier Fernández"
repo_url = "https://github.com/JAVIIFDEEZ/Finances"
repo_name = "JAVIIFDEEZ/Finances"
docs_dir = "docs"
site_dir = "site"
copyright = "© InvestingLab — uso privado"
nav = [
  { "Inicio" = "index.md" },
  { "Plan maestro" = "plan/plan-maestro.md" },
  { "Arquitectura" = ["architecture/index.md"] },
  { "Decisiones (ADR)" = [
    "adr/index.md",
    "adr/0001-record-architecture-decisions.md",
    "adr/0002-hexagonal-monorepo-with-independent-core.md",
    "adr/0003-python-quality-toolchain.md",
    "adr/0004-language-policy.md",
    "adr/0005-documentation-with-zensical.md",
  ] },
  { "Referencia API" = ["reference/index.md", "reference/config.md"] },
]

[project.theme]
language = "es"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo oscuro"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.tasklist.custom_checkbox = true
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["packages/investinglab/src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
merge_init_into_class = true
inherited_members = true
filters = ["!^_"]
