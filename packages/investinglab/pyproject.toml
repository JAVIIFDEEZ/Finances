[project]
name = "investinglab"
version = "0.1.0.dev0"
description = "InvestingLab core: market-data ingestion, portfolio analytics, Monte Carlo simulation and reporting."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Javier Fernández" }]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.5.4",
  "pandas>=3.1.0",
  "scipy>=1.18.1",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.16.2",
  "structlog>=26.1.0",
  "httpx>=0.28.1",
  "tenacity>=9.2.1",
  "aiolimiter>=1.3.0",
  "duckdb>=2.0.0",
  "pyarrow>=26.0.0",
  "exchange-calendars>=4.13.2",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.11.2", "seaborn>=0.13.2"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
